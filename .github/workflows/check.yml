name: Compile check

# Builds for the iOS Simulator without signing, so code errors show up without any Apple secrets.
# Manual only: every push already builds in the iOS workflow, and macOS minutes are billed 10x on private repos.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate project
        env:
          APPLE_TEAM_ID: ""
          BUNDLE_ID: com.grantoster.addys15
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild -project Addys15.xcodeproj -scheme Addys15 -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning: .*(deprecated|never)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
